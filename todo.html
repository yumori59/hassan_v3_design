<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASSAN v3 — 本番化タスクボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2efe6;
    --paper-deep: #e9e5d8;
    --line: #d8d3c2;
    --ink: #1c1a15;
    --ink-soft: #6b6557;
    --ink-faint: #9b957f;
    --infra: #b4530a;
    --infra-bg: #f7e8d8;
    --be: #1d4ed8;
    --be-bg: #e2e9fb;
    --fe: #15803d;
    --fe-bg: #ddefe0;
    --design: #be185d;
    --design-bg: #f9e2ec;
    --done: #9b957f;
    --card: #faf8f1;
    --shadow: 0 1px 0 rgba(28,26,21,.06), 0 6px 18px -8px rgba(28,26,21,.18);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 32px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 32px 100%,
      var(--paper);
    background-blend-mode: soft-light, soft-light, normal;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* ── header ─────────────────────────── */
  header {
    border-bottom: 2px solid var(--ink);
    background: var(--paper);
    padding: 28px 32px 0;
    position: relative;
  }
  .overline {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .22em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(26px, 4vw, 40px);
    font-weight: 700;
    letter-spacing: .01em;
    margin: 4px 0 2px;
  }
  h1 .v3 { color: var(--infra); }
  .subtitle { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }

  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
  }
  .total-progress { min-width: 260px; flex: 1; max-width: 420px; }
  .total-progress .nums {
    font-family: var(--mono);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .total-progress .nums b { color: var(--ink); font-weight: 600; }
  .bar {
    height: 8px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    display: flex;
    overflow: hidden;
  }
  .bar i { display: block; height: 100%; transition: width .35s ease; }
  .bar .seg-design { background: var(--design); }
  .bar .seg-infra { background: var(--infra); }
  .bar .seg-be   { background: var(--be); }
  .bar .seg-fe   { background: var(--fe); }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .04em;
    padding: 7px 13px;
    background: var(--card);
    border: 1px solid var(--ink);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease;
    user-select: none;
  }
  .btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
  .btn:active { transform: translate(1px,1px); box-shadow: 0 0 0 var(--ink); }
  .btn.toggled { background: var(--ink); color: var(--paper); }
  .btn.danger:hover { background: #fbe4e4; }

  /* ── board ─────────────────────────── */
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    padding: 28px 32px;
    max-width: 1720px;
    margin: 0 auto;
  }
  @media (max-width: 1360px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 1100px; } }
  @media (max-width: 768px) { .board { grid-template-columns: 1fr; max-width: 720px; } }

  /* ── kanban view ─────────────────────── */
  .board.kanban-view { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 1280px; }
  @media (max-width: 1100px) { .board.kanban-view { grid-template-columns: 1fr; max-width: 720px; } }
  .filter-row { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .05em;
    padding: 5px 12px;
    border: 1px solid var(--ink-faint);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip.active[data-cat="design"] { background: var(--design); border-color: var(--design); }
  .chip.active[data-cat="infra"]  { background: var(--infra);  border-color: var(--infra); }
  .chip.active[data-cat="be"]     { background: var(--be);     border-color: var(--be); }
  .chip.active[data-cat="fe"]     { background: var(--fe);     border-color: var(--fe); }
  .col.lane { --cat-color: var(--ink); --cat-bg: var(--paper-deep); }
  .col.lane[data-status="0"] { --cat-color: var(--ink-soft); }
  .col.lane[data-status="2"] { --cat-color: var(--done); }
  .kanban-view .tasks { min-height: 140px; }
  .kanban-view .tag.status-tag { display: none; }
  .tag.cat-tag { cursor: default; }

  .col { min-width: 0; }
  .col-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--cat-color);
    padding-bottom: 8px;
    margin-bottom: 6px;
  }
  .col-title { display: flex; align-items: baseline; gap: 10px; }
  .col-title .jp { font-size: 19px; font-weight: 700; }
  .col-title .en {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    color: var(--cat-color);
    text-transform: uppercase;
  }
  .col-count { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
  .col-count b { color: var(--cat-color); font-weight: 600; }
  .col-bar { height: 4px; background: var(--paper-deep); margin-bottom: 14px; }
  .col-bar i { display: block; height: 100%; background: var(--cat-color); transition: width .35s ease; }

  .col[data-cat="design"] { --cat-color: var(--design); --cat-bg: var(--design-bg); }
  .col[data-cat="infra"] { --cat-color: var(--infra); --cat-bg: var(--infra-bg); }
  .col[data-cat="be"]    { --cat-color: var(--be);    --cat-bg: var(--be-bg); }
  .col[data-cat="fe"]    { --cat-color: var(--fe);    --cat-bg: var(--fe-bg); }

  /* ── tasks ─────────────────────────── */
  .tasks { list-style: none; display: flex; flex-direction: column; gap: 7px; min-height: 40px; }
  .task {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--cat-color);
    padding: 9px 10px 9px 11px;
    box-shadow: var(--shadow);
    cursor: grab;
    position: relative;
    animation: pop .18s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
  .task.dragging { opacity: .35; cursor: grabbing; }
  .task.drop-above::before, .task.drop-below::after {
    content: "";
    position: absolute;
    left: -3px; right: 0;
    height: 2px;
    background: var(--cat-color);
  }
  .task.drop-above::before { top: -5px; }
  .task.drop-below::after { bottom: -5px; }

  .status-btn {
    flex: none;
    width: 18px; height: 18px;
    margin-top: 2px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: all .15s ease;
  }
  .task[data-status="1"] .status-btn {
    border-color: var(--cat-color);
    background: linear-gradient(90deg, var(--cat-color) 50%, transparent 50%);
  }
  .task[data-status="2"] .status-btn { border-color: var(--cat-color); background: var(--cat-color); }
  .task[data-status="2"] .status-btn::after {
    content: "";
    position: absolute; inset: 3px 4px 5px 4px;
    border-left: 2px solid var(--card);
    border-bottom: 2px solid var(--card);
    transform: rotate(-45deg);
  }

  .task-main { flex: 1; min-width: 0; }
  .task-tags { display: flex; gap: 5px; margin-bottom: 3px; flex-wrap: wrap; }
  .tag {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .08em;
    padding: 1.5px 6px;
    border: 1px solid var(--cat-color);
    color: var(--cat-color);
    background: var(--cat-bg);
    cursor: pointer;
    user-select: none;
  }
  .tag.status-tag { border-color: var(--ink-faint); color: var(--ink-soft); background: transparent; }
  .task[data-status="1"] .tag.status-tag { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .task[data-status="2"] .tag.status-tag { border-style: dashed; }

  .task-title {
    font-size: 13.5px;
    line-height: 1.5;
    word-break: break-word;
    outline: none;
    border-radius: 2px;
  }
  .task-title:focus { background: #fff; box-shadow: 0 0 0 2px var(--cat-color); padding: 0 3px; }
  .task[data-status="2"] .task-title { color: var(--done); text-decoration: line-through; text-decoration-color: rgba(28,26,21,.35); }
  .task[data-status="2"] { border-left-style: dashed; }
  .task[data-status="2"] .tag:not(.status-tag) { opacity: .55; }

  .del-btn {
    flex: none;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1;
    padding: 3px 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .12s ease, color .12s ease;
  }
  .task:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: #b4230a; }

  /* ── add row ─────────────────────────── */
  .add-row { display: flex; gap: 6px; margin-top: 10px; }
  .add-row select, .add-row input {
    font-family: var(--sans);
    font-size: 12.5px;
    border: 1px dashed var(--ink-faint);
    background: transparent;
    color: var(--ink);
    padding: 8px 9px;
    outline: none;
  }
  .add-row select { font-family: var(--mono); font-size: 11px; flex: none; cursor: pointer; }
  .add-row input { flex: 1; min-width: 0; }
  .add-row input:focus, .add-row select:focus { border-style: solid; border-color: var(--cat-color); background: var(--card); }
  .add-row input::placeholder { color: var(--ink-faint); }
  .add-btn {
    flex: none;
    font-family: var(--mono);
    font-size: 15px;
    width: 34px;
    border: 1px dashed var(--ink-faint);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .add-btn:hover { border-style: solid; border-color: var(--cat-color); color: var(--cat-color); background: var(--cat-bg); }

  body.hide-done .task[data-status="2"] { display: none; }

  .hint {
    max-width: 1500px;
    margin: 0 auto;
    padding: 0 32px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-faint);
    letter-spacing: .03em;
  }
  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    background: linear-gradient(transparent, var(--paper) 40%);
    text-align: right;
    padding: 14px 32px 10px;
    pointer-events: none;
    letter-spacing: .05em;
  }
</style>
</head>
<body>

<header>
  <div class="overline">Productionization Task Board</div>
  <h1>HASSAN <span class="v3">v3</span> やることリスト</h1>
  <div class="subtitle">設計リポの残作業 + インフラ / バックエンド / フロントエンド の機能単位タスク</div>
  <div class="header-row">
    <div class="total-progress">
      <div class="nums"><span>TOTAL PROGRESS</span><span><b id="total-done">0</b> / <span id="total-all">0</span> done</span></div>
      <div class="bar" id="total-bar"></div>
    </div>
    <div class="toolbar">
      <button class="btn" id="view-btn">▦ かんばん表示</button>
      <button class="btn" id="toggle-done">✓ 完了を隠す</button>
      <button class="btn" id="export-btn">↓ JSON書き出し</button>
      <button class="btn" id="import-btn">↑ JSON読み込み</button>
      <button class="btn danger" id="reset-btn">⟲ 初期データに戻す</button>
      <input type="file" id="import-file" accept=".json" hidden>
    </div>
  </div>
</header>

<div class="board" id="board"></div>

<p class="hint">操作: ○クリックで 未着手→進行中→完了 / かんばん表示ではレーン間ドラッグでステータス変更 / タイトルクリックでその場編集 (Enterで確定) / タグクリックで工程切替 / 変更はこのブラウザに自動保存</p>

<footer>hassan_v3 / saved in localStorage</footer>

<script>
"use strict";

const STORAGE_KEY = "hassan-v3-taskboard-v1";
const CATS = [
  { id: "design", jp: "設計 (このリポ)", tag: "設計リポ", en: "Design Repo", phases: ["調査", "設計", "レビュー", "引き渡し"] },
  { id: "infra", jp: "インフラ", tag: "インフラ", en: "Infrastructure", phases: ["設計", "構築"] },
  { id: "be",    jp: "バックエンド", tag: "BE", en: "Backend / Go",  phases: ["設計", "実装"] },
  { id: "fe",    jp: "フロントエンド", tag: "FE", en: "Frontend / Next.js", phases: ["設計", "実装"] },
];
const catOf = id => CATS.find(c => c.id === id);
const STATUS_LABEL = ["未着手", "進行中", "完了"];
const STATUS_META = [
  { s: 0, jp: "未着手", en: "Backlog" },
  { s: 1, jp: "進行中", en: "In Progress" },
  { s: 2, jp: "完了", en: "Done" },
];

/* 初期データ: docs/design/design_memo.md の機能一覧・決定ログ +

   設計列は aidlc-docs/inception/productionization/plan.md と aidlc-state.md の残タスク (2026-07-30 時点)。
   運用: タスク・検討が完了したらこの SEED を更新する (status を 2 に / 新タスクは t(...) を追記。
   既存タスクの title は localStorage との合流キーなので変えない — ルート CLAUDE.md 参照) */
const SEED = [
  // ── 設計 (hassan_v3 リポでの残作業) ──
  t("design", "設計", "実装リポの AI 駆動開発ワークフロー確定 (construction-workflow: 作業ループ S-1〜S-10 / issue 粒度・DoD / モデル運用 / 人間承認点 → templates/shared/.claude/rules 01〜04 + issue/PR テンプレート + infra-reviewer 新設)", 2),

  t("design", "レビュー", "レビュー B の重大 7 件を修正 (auth.md / API/ — 起草側セッションで対応)", 1),

  t("design", "設計", "Q-3 (v3 のスコープ) の回答確定", 1),

  t("design", "調査", "インフラ必要要素の一覧をあるふぁさんに確認 (design_memo の TODO。本ボードのインフラ列が叩き台)"),

  t("design", "設計", "Task-3d: operations.md 起草 (シークレット管理・Agent 発行込みデプロイ手順・段階リリース・DB 自動適用範囲)", 2),

  t("design", "設計", "リポジトリ構成を app モノレポ + infra リポの 2 分割へ変更 (ユーザー決定 2026-08-03。Q-2 [Answer 2]=D。architecture.md D-I 反転 + §3.11 新設 / operations.md §5.1.1 / templates を app-monorepo へ再編 / 波及 20+ ファイル)", 2),

  t("design", "レビュー", "モノレポ化の 2 巡目 (雛形) + 設計文書レビュー — 重大 8 / 中 18 / 軽微 10。反映判定 一致 18 / 部分反映 7 / 不一致 1", 2),
  t("design", "設計", "重大 8 件の反映: check-regen.sh を git status 方式へ作り直し (削除を検出せずインデックスを汚染していた) / CODEOWNERS の双方承認の断定を撤回 / D-I 却下理由の事実誤りを訂正し §3.11.4 を新設", 2),

// id は cat+title から決める (安定 id)。SEED への追記が既存の保存データへ自動合流できるようにする
function t(cat, phase, title, status = 0) { return { id: "s:" + cat + ":" + title, cat, phase, title, status }; }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return mergeSeed(parsed);
    }
  } catch (e) { /* 壊れた保存データは初期データで置き換える */ }
  return JSON.parse(JSON.stringify(SEED));
}

// ユーザーが削除した初期タスクを合流時に復活させないための記録
const DELETED_KEY = STORAGE_KEY + ":deleted";
function loadDeleted() {
  try { return new Set(JSON.parse(localStorage.getItem(DELETED_KEY)) || []); }
  catch (e) { return new Set(); }
}
function saveDeleted(set) { localStorage.setItem(DELETED_KEY, JSON.stringify([...set])); }
let deleted = loadDeleted();

// 保存済みデータに、SEED に後から追加された項目を合流させる
// (旧形式の id "s0" 等でも cat+title が一致すれば既存とみなし、重複させない)
function mergeSeed(stored) {
  const ids = new Set(stored.map(x => x.id));
  const sigs = new Set(stored.map(x => x.cat + " " + x.title));
  let added = false;
  for (const s of SEED) {
    const sig = s.cat + " " + s.title;
    if (ids.has(s.id) || sigs.has(sig) || deleted.has(s.id) || deleted.has(sig)) continue;
    stored.push(JSON.parse(JSON.stringify(s)));
    added = true;
  }
  if (added) localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
  return stored;
}

let tasks = load();
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

function uid() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ── render ─────────────────────────── */
const board = document.getElementById("board");
const VIEW_KEY = STORAGE_KEY + ":view";
let view = localStorage.getItem(VIEW_KEY) === "kanban" ? "kanban" : "cat";
let kanbanFilter = "all";

function render() {
  board.classList.toggle("kanban-view", view === "kanban");
  board.innerHTML = "";
  if (view === "kanban") renderKanban(); else renderCatBoard();
  renderTotals();
  document.getElementById("view-btn").textContent = view === "kanban" ? "▤ 分類表示" : "▦ かんばん表示";
}

function renderCatBoard() {
  for (const cat of CATS) {
    const col = document.createElement("section");
    col.className = "col";
    col.dataset.cat = cat.id;
    const items = tasks.filter(x => x.cat === cat.id);
    const done = items.filter(x => x.status === 2).length;
    const pct = items.length ? Math.round(done / items.length * 100) : 0;

    col.innerHTML = `
      <div class="col-head">
        <div class="col-title"><span class="jp">${cat.jp}</span><span class="en">${cat.en}</span></div>
        <div class="col-count"><b>${String(done).padStart(2, "0")}</b> / ${String(items.length).padStart(2, "0")}</div>
      </div>
      <div class="col-bar"><i style="width:${pct}%"></i></div>
      <ul class="tasks" data-cat="${cat.id}"></ul>
      <div class="add-row">
        <select aria-label="工程">${cat.phases.map(p => `<option>${p}</option>`).join("")}</select>
        <input type="text" placeholder="タスクを追加..." aria-label="新規タスク">
        <button class="add-btn" title="追加">+</button>
      </div>`;

    const ul = col.querySelector(".tasks");
    for (const item of items) ul.appendChild(renderTask(item, "cat"));

    const input = col.querySelector("input");
    const select = col.querySelector("select");
    const add = () => {
      const title = input.value.trim();
      if (!title) return;
      tasks.push({ id: uid(), cat: cat.id, phase: select.value, title, status: 0 });
      input.value = "";
      save(); render();
      col.scrollIntoView({ block: "nearest" });
    };
    col.querySelector(".add-btn").addEventListener("click", add);
    input.addEventListener("keydown", e => { if (e.key === "Enter") add(); });

    board.appendChild(col);
  }
}

function renderKanban() {
  // 分類フィルタ
  const filter = document.createElement("div");
  filter.className = "filter-row";
  filter.innerHTML = [{ id: "all", jp: "すべて" }, ...CATS].map(c =>
    `<button class="chip${kanbanFilter === c.id ? " active" : ""}" data-cat="${c.id}">${c.jp}</button>`).join("");
  filter.querySelectorAll(".chip").forEach(ch =>
    ch.addEventListener("click", () => { kanbanFilter = ch.dataset.cat; render(); }));
  board.appendChild(filter);

  for (const meta of STATUS_META) {
    const col = document.createElement("section");
    col.className = "col lane";
    col.dataset.status = meta.s;
    const items = tasks.filter(x => x.status === meta.s && (kanbanFilter === "all" || x.cat === kanbanFilter));

    col.innerHTML = `
      <div class="col-head">
        <div class="col-title"><span class="jp">${meta.jp}</span><span class="en">${meta.en}</span></div>
        <div class="col-count"><b>${String(items.length).padStart(2, "0")}</b> 件</div>
      </div>
      <ul class="tasks"></ul>
      <div class="add-row">
        <select aria-label="分類">${CATS.map(c => `<option value="${c.id}"${kanbanFilter === c.id ? " selected" : ""}>${c.tag}</option>`).join("")}</select>
        <input type="text" placeholder="タスクを追加..." aria-label="新規タスク">
        <button class="add-btn" title="追加">+</button>
      </div>`;

    const ul = col.querySelector(".tasks");
    for (const item of items) ul.appendChild(renderTask(item, "status"));

    const input = col.querySelector("input");
    const select = col.querySelector("select");
    const add = () => {
      const title = input.value.trim();
      if (!title) return;
      const cat = catOf(select.value);
      tasks.push({ id: uid(), cat: cat.id, phase: cat.phases[0], title, status: meta.s });
      input.value = "";
      save(); render();
    };
    col.querySelector(".add-btn").addEventListener("click", add);
    input.addEventListener("keydown", e => { if (e.key === "Enter") add(); });

    board.appendChild(col);
  }
}

function renderTask(item, mode) {
  const li = document.createElement("li");
  li.className = "task";
  li.dataset.id = item.id;
  li.dataset.status = item.status;
  li.draggable = true;
  if (mode === "status") {
    // かんばん表示ではレーンではなくカード自身が分類色を持つ
    li.style.setProperty("--cat-color", `var(--${item.cat})`);
    li.style.setProperty("--cat-bg", `var(--${item.cat}-bg)`);
  }

  li.innerHTML = `
    <button class="status-btn" title="状態を切替"></button>
    <div class="task-main">
      <div class="task-tags">
        ${mode === "status" ? `<span class="tag cat-tag">${esc(catOf(item.cat).tag)}</span>` : ""}
        <span class="tag phase-tag" title="工程を切替">${esc(item.phase)}</span>
        <span class="tag status-tag">${STATUS_LABEL[item.status]}</span>
      </div>
      <div class="task-title" contenteditable="true" spellcheck="false">${esc(item.title)}</div>
    </div>
    <button class="del-btn" title="削除">✕</button>`;

  li.querySelector(".status-btn").addEventListener("click", () => {
    item.status = (item.status + 1) % 3;
    save(); render();
  });

  li.querySelector(".phase-tag").addEventListener("click", () => {
    const phases = catOf(item.cat).phases;
    item.phase = phases[(phases.indexOf(item.phase) + 1) % phases.length] || phases[0];
    save(); render();
  });

  li.querySelector(".del-btn").addEventListener("click", () => {
    if (!confirm(`削除しますか?\n「${item.title}」`)) return;
    tasks = tasks.filter(x => x.id !== item.id);
    deleted.add(item.id);
    deleted.add(item.cat + " " + item.title);
    saveDeleted(deleted);
    save(); render();
  });

  const titleEl = li.querySelector(".task-title");
  titleEl.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); titleEl.blur(); }
    if (e.key === "Escape") { titleEl.textContent = item.title; titleEl.blur(); }
  });
  titleEl.addEventListener("blur", () => {
    const v = titleEl.textContent.trim();
    if (v && v !== item.title) { item.title = v; save(); }
    else titleEl.textContent = item.title;
    renderTotals();
  });
  // 編集開始時にドラッグと干渉しないようにする
  titleEl.addEventListener("focus", () => { li.draggable = false; });
  titleEl.addEventListener("blur", () => { li.draggable = true; });

  // drag & drop
  li.addEventListener("dragstart", e => {
    dragId = item.id;
    li.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  li.addEventListener("dragend", () => { dragId = null; render(); });
  li.addEventListener("dragover", e => {
    e.preventDefault();
    if (dragId === item.id) return;
    const rect = li.getBoundingClientRect();
    const above = e.clientY < rect.top + rect.height / 2;
    li.classList.toggle("drop-above", above);
    li.classList.toggle("drop-below", !above);
  });
  li.addEventListener("dragleave", () => li.classList.remove("drop-above", "drop-below"));
  li.addEventListener("drop", e => {
    e.preventDefault();
    li.classList.remove("drop-above", "drop-below");
    if (!dragId || dragId === item.id) return;
    const dragged = tasks.find(x => x.id === dragId);
    if (!dragged) return;
    const rect = li.getBoundingClientRect();
    const above = e.clientY < rect.top + rect.height / 2;
    adoptGroup(dragged, item, mode);
    tasks = tasks.filter(x => x.id !== dragId);
    let idx = tasks.findIndex(x => x.id === item.id);
    if (!above) idx += 1;
    tasks.splice(idx, 0, dragged);
    save(); render();
  });

  return li;
}

let dragId = null;

// ドロップ先の列に応じて分類 (分類ビュー) またはステータス (かんばん) を引き継ぐ
function adoptGroup(dragged, target, mode) {
  if (mode === "status") { dragged.status = target.status; return; }
  if (dragged.cat !== target.cat) {
    dragged.cat = target.cat;
    const phases = catOf(target.cat).phases;
    if (!phases.includes(dragged.phase)) dragged.phase = phases[0];
  }
}

// 空の列 (末尾) へのドロップ
board.addEventListener("dragover", e => e.preventDefault());
board.addEventListener("drop", e => {
  if (!dragId) return;
  const colEl = e.target.closest(".col");
  if (!colEl || e.target.closest(".task")) return;
  const dragged = tasks.find(x => x.id === dragId);
  if (!dragged) return;
  if (view === "kanban") {
    dragged.status = Number(colEl.dataset.status);
  } else {
    const cat = colEl.dataset.cat;
    if (dragged.cat !== cat) {
      dragged.cat = cat;
      const phases = catOf(cat).phases;
      if (!phases.includes(dragged.phase)) dragged.phase = phases[0];
    }
  }
  tasks = tasks.filter(x => x.id !== dragId);
  tasks.push(dragged);
  dragId = null;
  save(); render();
});

function renderTotals() {
  const all = tasks.length;
  const done = tasks.filter(x => x.status === 2).length;
  document.getElementById("total-done").textContent = done;
  document.getElementById("total-all").textContent = all;
  const bar = document.getElementById("total-bar");
  bar.innerHTML = CATS.map(c => {
    const d = tasks.filter(x => x.cat === c.id && x.status === 2).length;
    return `<i class="seg-${c.id}" style="width:${all ? d / all * 100 : 0}%"></i>`;
  }).join("");
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

/* ── toolbar ─────────────────────────── */
document.getElementById("view-btn").addEventListener("click", () => {
  view = view === "kanban" ? "cat" : "kanban";
  localStorage.setItem(VIEW_KEY, view);
  render();
});

document.getElementById("toggle-done").addEventListener("click", e => {
  document.body.classList.toggle("hide-done");
  e.currentTarget.classList.toggle("toggled");
  e.currentTarget.textContent = document.body.classList.contains("hide-done") ? "✓ 完了を表示" : "✓ 完了を隠す";
});

document.getElementById("export-btn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hassan-v3-tasks.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

const importFile = document.getElementById("import-file");
document.getElementById("import-btn").addEventListener("click", () => importFile.click());
importFile.addEventListener("change", () => {
  const file = importFile.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error("形式が不正です");
      tasks = data;
      // 読み込んだ内容を正とする: 含まれない初期タスクは削除済み扱いにして復活を防ぐ
      const sigs = new Set(data.map(x => x.cat + " " + x.title));
      const ids = new Set(data.map(x => x.id));
      deleted = new Set();
      for (const s of SEED) {
        if (!ids.has(s.id) && !sigs.has(s.cat + " " + s.title)) { deleted.add(s.id); deleted.add(s.cat + " " + s.title); }
      }
      saveDeleted(deleted);
      save(); render();
    } catch (err) {
      alert("読み込みに失敗しました: " + err.message);
    }
    importFile.value = "";
  };
  reader.readAsText(file);
});

document.getElementById("reset-btn").addEventListener("click", () => {
  if (!confirm("すべての変更を破棄して初期データに戻します。よろしいですか?")) return;
  tasks = JSON.parse(JSON.stringify(SEED));
  deleted = new Set();
  saveDeleted(deleted);
  save(); render();
});

render();
</script>
</body>
</html>
