# layering-scopes.yml — 層規約の適用範囲 (機械可読)
#
# 設計リポ (hassan_v3) の docs/design/architecture.md §3.5.2 の対象パス表の**機械可読な写し**。
# 決定の正は architecture.md §3.5.2。本ファイルは **CI 検査 (D-2⑦) の入力**である。
# CI は設計リポを読めないため写しが必要になっている (二重管理になるので、
#  ドメインを追加・移動する PR では両方を更新する。同期はレビューで見る)。
#
# CI 検査 (scripts/check-layer-scopes.sh) が扱う 3 つの集合:
#   ① service/ usecase/ repository/ 配下の実ディレクトリ集合 (common_layers を除く)
#   ② 本ファイルの v3_domains / ported_domains
#   ③ .golangci.yml の L2-service-no-cross-domain-<domain> 規則名 / L5-no-external-sdk の files /
#      L3-no-sqlc-outside-repository の files / exclusions のパス正規表現に現れるドメイン名
#
# **比較は非対称にする**。移植分は ③ に載せてはいけない (L-2 / L-3 / L-5 と
# 肥大化 lint の強制対象外 = architecture.md §3.5.2) ので、①②③ を対称に突き合わせると
# **ported_domains が非空になった瞬間に必ず落ちる**。検査する条件は次の 3 つ:
#
#   条件 1: ① == (v3_domains ∪ ported_domains)
#           → ドメインを新設して本ファイルに登録し忘れた場合に落ちる
#   条件 2: ③ == v3_domains
#           → v3 新規ドメインを .golangci.yml に登録し忘れた / 余分な登録が残っている場合に落ちる
#   条件 3: ported_domains のどのドメイン名も ③ に現れない
#           → 移植分を誤って強制対象に入れた場合に落ちる (Q-L3=A に反する)

# v3 新規ドメイン: 4 層 (controller → usecase → service → repository) + entity + gateway。
# 依存規則 L-1〜L-6 と肥大化 lint (dupl / cyclop / funlen) の**強制対象**。
# 第 1 リリースの機能セット (architecture.md の D-J: テーマ / アセット / 会話型アイデア創出とその生成物)。
v3_domains:
  - theme
  - asset
  - conversation
  - idea
  - plan

# v2 移植分: v2 の 3 層規約のまま移植する (hassan-v2-backend/CLAUDE.md:26-34)。
# `service/<domain>` を作らない。L-2 / L-3 / L-5 と肥大化 lint の強制対象**外**。
# ただし **LLM 呼び出しだけは gateway/ 経由が必須** (ユーザー決定 2026-07-30。Q-L11=A-1) —
# gateway を通らない LLM 呼び出しを残さないことが移植の受入条件 (architecture.md §3.5.2)。
#
# 移植ドメインの割り当ては移植計画で確定する。**移植を始めるまでは空**でよいが、
# 空のまま `usecase/<移植ドメイン>` を作ると条件 1 で落ちる (それが意図した挙動)。
# ここに追加したドメインは **.golangci.yml に登録してはいけない** (条件 3)。
# 4 層へ作り替える段で、sqlc 生成型の参照 (enum / モデル型 / params 構造体) を
# entity/ へ移す作業が発生する (architecture.md §6)。
ported_domains: []

# 共通層: ドメイン区分を持たない。L-1 / L-4 / L-5 と肥大化 lint を全体に適用する。
# **architecture.md §3.5.2 の「共通層」の行と同一の集合に保つ** (写しのドリフトを作らない)。
# 検査 ⑦ はこのリストを①のドメイン集合から除外するために使う。
common_layers:
  - entity
  - gateway
  - controller
  - config
