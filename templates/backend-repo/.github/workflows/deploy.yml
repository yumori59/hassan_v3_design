name: Deploy

# backend リポジトリ雛形 (Q-7=B: Terraform = 基盤 / ecspresso = サービス定義・タスク定義・リリース)。
# <...> のプレースホルダを実構成に合わせて置換する。
#
# 設計上の要点 (docs/design/architecture.md の D-G / D-6 / AC-3.3):
#   - **イメージタグをリポジトリへ commit しない** (v2 の運用は廃止)。CI 内でレンダリングする
#   - **Managed Agent の発行・更新をデプロイ手順の一部にする** — コードだけ先行デプロイして
#     Agent 再発行を忘れると、tool 引数が黙って捨てられ機能が死ぬ (BE-8 / BE-10)
#   - dev は main への push で継続デプロイ、prod は手動実行のみ (C-15: 本番は開発完了後に 1 回)
#
# 人間承認点 (H-2 DB マイグレーション / H-3 Agent 再発行 / H-4 本番デプロイ) の定義と確認観点は
# .claude/rules/04-human-checkpoints.md が SSOT。本ファイルはその**機構**の実体である:
#   - 承認は GitHub Actions の environment (required reviewers) で挟む。**ジョブを分けないと承認位置を作れない**
#   - 承認単位ごとに別 environment を使う (同一 environment の複数ジョブは 1 回の承認でまとめて解放され、
#     「何を承認したか」が履歴から読めなくなるため)
#   - environment が未作成 / 承認者未設定だとジョブは待機せず素通りする
#     → 立ち上げ時チェックリスト (04-human-checkpoints.md §4.2) を必ず実施する
#
# 適用順序 (この順序を変えない): build → マイグレーション → Agent 再発行 → サービスのリリース

on:
  push:
    branches: [main]          # → dev へ継続デプロイ (承認なし。C-15)
  workflow_dispatch:          # → prod への手動リリース (H-4)
    inputs:
      environment:
        description: デプロイ先
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write             # OIDC で AWS ロールを引き受ける

# 同一環境への並行適用を禁止する (マイグレーションの同時適用・承認待ち中の追い越しを防ぐ)。
# 承認待ちのジョブをキャンセルしない (cancel-in-progress: false)。
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  # === 1. ビルド (何も適用しないため承認ゲートを持たない) =====================
  build:
    name: ビルド
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.ctx.outputs.env_name }}
      image: ${{ steps.image.outputs.image }}
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: デプロイ先の確定と prod 起動の前提チェック (H-4 / D-7)
        id: ctx
        run: |
          ENV_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          if [ "$ENV_NAME" = "prod" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::prod へのリリースは main からのみ許可する (未レビューの変更を本番に出さないため)"
            exit 1
          fi
          echo "デプロイ先: $ENV_NAME / ref: $GITHUB_REF / sha: $GITHUB_SHA"

      - name: AWS 認証 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: <デプロイ用 IAM ロールの ARN>
          aws-region: ap-northeast-1

      - name: ECR ログイン
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ビルドとプッシュ
        id: image
        # 日付 + コミット SHA。**リポジトリへ commit しない** (ジョブ出力で後続へ渡すだけ)
        run: |
          IMAGE_TAG="$(date +%Y%m%d)-${GITHUB_SHA::8}"
          IMAGE="${{ steps.ecr.outputs.registry }}/<ECR リポジトリ名>:${IMAGE_TAG}"
          docker build -f <Dockerfile のパス> -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # === 2. DB マイグレーション (H-2 / D-4) ===================================
  # 2-a. 差分の検査と承認ルーティング (承認なし。適用は一切しない)
  plan_migration:
    name: マイグレーション差分の検査
    needs: build
    runs-on: ubuntu-latest
    outputs:
      has_diff: ${{ steps.plan.outputs.has_diff }}
      destructive: ${{ steps.plan.outputs.destructive }}
      approval_env: ${{ steps.route.outputs.approval_env }}
    steps:
      - uses: actions/checkout@v4

      # 差分生成が DB 接続を要する方式のときだけ必要 (下のコメントを参照)。
      # ランナーから RDS へ直接接続する経路は作らない (RDS は private subnet)。
      - name: AWS 認証 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: <マイグレーション用 IAM ロールの ARN>
          aws-region: ap-northeast-1

      - name: 差分の生成と破壊的変更の検出
        id: plan
        # 方式 (psqldef / golang-migrate) は設計リポ hassan_v3 で未確定 (D-4) のためプレースホルダ。
        # 確定後にここへ差分生成コマンドを実装する。**出力契約は変えないこと**:
        #   has_diff=true|false      … 適用すべき差分があるか (false なら適用ジョブをスキップ)
        #   destructive=true|false   … 04-human-checkpoints.md §2.2 の 1〜6 のいずれかを含むか
        #   migration-diff.txt       … 人間が承認前に読む差分の全文
        #
        # **経路は方式に依存せず確定している** (hassan_v3 docs/design/operations.md §5.1 / infrastructure.md INF-H):
        #   - 差分生成が DB への接続を要する場合 (psqldef の現行スキーマ比較・golang-migrate の
        #     適用済みバージョン問い合わせ) は、**apply_migration と同じ ECS RunTask 経路**で
        #     mode=plan として実行し、①起動 ②完了待ち ③CloudWatch Logs の取得 の 3 段で差分を回収する
        #   - **GitHub ランナーから RDS へ直接接続しない**。RDS をパブリックアクセス可にする案は
        #     infrastructure.md INF-H の却下案 (b) として明示的に退けられている
        #   - 接続情報 (DATABASE_URL) を GitHub environment secret に置かない (operations.md §4.1 の限定列挙)
        run: |
          : > migration-diff.txt
          echo "(マイグレーション方式の確定後に差分生成を実装する。経路は RunTask で確定)" >> migration-diff.txt
          echo "has_diff=false" >> "$GITHUB_OUTPUT"
          echo "destructive=false" >> "$GITHUB_OUTPUT"

      - name: 承認ルーティングの決定
        id: route
        # dev × 非破壊 → dev (承認者なし = 自動適用) / dev × 破壊的 → dev-db-destructive /
        # prod → prod-db。**環境の重要度ではなくデータ喪失の不可逆性で線を引く**
        run: |
          ENV_NAME='${{ needs.build.outputs.env_name }}'
          DESTRUCTIVE='${{ steps.plan.outputs.destructive }}'
          if [ "$ENV_NAME" = "prod" ]; then
            APPROVAL_ENV="prod-db"
          elif [ "$DESTRUCTIVE" = "true" ]; then
            APPROVAL_ENV="dev-db-destructive"
          else
            APPROVAL_ENV="dev"
          fi
          echo "approval_env=$APPROVAL_ENV" >> "$GITHUB_OUTPUT"
          echo "承認を通す environment: $APPROVAL_ENV"

      - name: 承認材料をジョブサマリへ出す
        run: |
          {
            echo "## DB マイグレーション (H-2) の承認材料"
            echo "- 適用先: \`${{ needs.build.outputs.env_name }}\`"
            echo "- 差分あり: \`${{ steps.plan.outputs.has_diff }}\` / 破壊的変更: \`${{ steps.plan.outputs.destructive }}\`"
            echo "- 通す environment: \`${{ steps.route.outputs.approval_env }}\`"
            echo "- 破壊的変更が true の場合、**承認コメントに RDS スナップショット ID を書くこと**"
            echo ""
            echo '```sql'
            cat migration-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 2-b. 適用 (承認ゲート。差分が無ければスキップ)
  #
  # **適用は GitHub ランナーからではなく ECS RunTask で行う** (hassan_v3 docs/design/infrastructure.md INF-H /
  # operations.md §5.1)。RDS は private subnet にあり、ランナーからは到達しない。
  # ランナーに到達させるには RDS をパブリックアクセス可にするしかなく、それは INF-H の却下案 (b) である。
  #   - 接続情報は**マイグレーション実行タスク定義の `secrets`** (Secrets Manager) で注入される。
  #     **GitHub environment secret に DATABASE_URL を置かない** (operations.md §4.1 の限定列挙)
  #   - 構造 (この 4 段を変えない): ①RunTask 起動 → ②完了待ち → ③CloudWatch Logs の取得 (成否によらず) →
  #     ④終了コードの判定
  #   - **完了待ちを `aws ecs wait tasks-stopped` の既定 (6 秒 × 100 回 ≒ 10 分) に依存させない**。
  #     マイグレーションが 10 分を超え得るため、上限をワークフロー変数で明示する
  apply_migration:
    name: DB マイグレーションの適用 (H-2)
    needs: [build, plan_migration]
    if: ${{ needs.plan_migration.outputs.has_diff == 'true' }}
    runs-on: ubuntu-latest
    # ここが H-2 の承認位置。prod-db / dev-db-destructive には required reviewers を設定しておく
    environment: ${{ needs.plan_migration.outputs.approval_env }}
    env:
      ENV_NAME: ${{ needs.build.outputs.env_name }}
      # RunTask の宛先。値は infra (Terraform) の出力から埋める。**秘密ではない** (variable でよい)
      CLUSTER: <ECS クラスタ名>
      TASK_DEF: <マイグレーション実行タスク定義のファミリ名>
      CONTAINER: <マイグレーション実行コンテナ名>
      SUBNETS: <private subnet ID をカンマ区切り>
      SECURITY_GROUPS: <RunTask 用セキュリティグループ ID>
      LOG_GROUP: <マイグレーション用 CloudWatch ロググループ名>
      LOG_STREAM_PREFIX: <awslogs-stream-prefix の値>
      # 完了待ちの上限とポーリング間隔 (秒)
      WAIT_TIMEOUT_SECONDS: "1800"
      POLL_INTERVAL_SECONDS: "10"
    steps:
      - uses: actions/checkout@v4

      - name: AWS 認証 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 要求権限: ecs:RunTask / ecs:DescribeTasks / iam:PassRole (タスク実行ロール・タスクロール) /
          #           logs:GetLogEvents  (infrastructure.md INF-I)
          role-to-assume: <マイグレーション用 IAM ロールの ARN>
          aws-region: ap-northeast-1

      - name: ① RunTask の起動 (VPC 内から RDS へ接続する)
        id: run
        # <マイグレーション適用コマンド> は方式 (psqldef / golang-migrate) の確定後に埋める (D-4)。
        # **経路と待ち合わせの構造は変えない**
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUPS}],assignPublicIp=DISABLED}" \
            --started-by "gha-${GITHUB_RUN_ID}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"${CONTAINER}\",\"command\":[\"<マイグレーション適用コマンド>\"],\"environment\":[{\"name\":\"APP_ENV\",\"value\":\"${ENV_NAME}\"}]}]}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::RunTask の起動に失敗しました (aws ecs run-task の failures を確認する)"
            exit 1
          fi
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "task_id=${TASK_ARN##*/}" >> "$GITHUB_OUTPUT"
          echo "起動したタスク: $TASK_ARN"

      - name: ② 完了待ち (STOPPED になるまでポーリング。上限は WAIT_TIMEOUT_SECONDS)
        id: wait
        # **ここでは失敗させない** — タイムアウトでも③のログ取得を必ず実行するため、判定は④に集約する
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + WAIT_TIMEOUT_SECONDS ))
          status=""
          while :; do
            status=$(aws ecs describe-tasks --cluster "$CLUSTER" \
              --tasks "${{ steps.run.outputs.task_arn }}" \
              --query 'tasks[0].lastStatus' --output text)
            echo "lastStatus=$status"
            [ "$status" = "STOPPED" ] && { echo "result=stopped" >> "$GITHUB_OUTPUT"; break; }
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "result=timeout" >> "$GITHUB_OUTPUT"
              echo "last_status=$status" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done

      - name: ③ CloudWatch Logs の取得 (成否によらず実行する)
        if: ${{ always() && steps.run.outputs.task_arn != '' }}
        # RunTask 方式ではジョブの出力に「タスクが失敗した」しか出ないため、
        # **ログを取らないと失敗理由が読めない**。ジョブサマリに残す
        run: |
          set -uo pipefail
          STREAM="${LOG_STREAM_PREFIX}/${CONTAINER}/${{ steps.run.outputs.task_id }}"
          {
            echo "## マイグレーション実行タスクのログ"
            echo "- ロググループ: \`${LOG_GROUP}\` / ストリーム: \`${STREAM}\`"
            echo ""
            echo '```'
            aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$STREAM" \
              --start-from-head --query 'events[].message' --output text \
              || echo "(ログストリームがまだ作成されていない / 取得に失敗した)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ④ 終了コードの判定
        if: ${{ always() && steps.run.outputs.task_arn != '' }}
        run: |
          set -uo pipefail
          if [ "${{ steps.wait.outputs.result }}" != "stopped" ]; then
            echo "::error::完了待ちが ${WAIT_TIMEOUT_SECONDS} 秒を超えました (最終状態: ${{ steps.wait.outputs.last_status }})。タスクは停止させていないため、CloudWatch Logs で進行を確認してから再実行を判断する"
            exit 1
          fi
          read -r EXIT_CODE STOPPED_REASON <<<"$(aws ecs describe-tasks --cluster "$CLUSTER" \
            --tasks "${{ steps.run.outputs.task_arn }}" \
            --query "tasks[0].[containers[?name=='${CONTAINER}']|[0].exitCode, stoppedReason]" \
            --output text)"
          echo "exitCode=$EXIT_CODE / stoppedReason=$STOPPED_REASON"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::マイグレーションタスクが異常終了しました (exitCode=$EXIT_CODE / $STOPPED_REASON)"
            exit 1
          fi
          echo "適用先: ${ENV_NAME} / 破壊的: ${{ needs.plan_migration.outputs.destructive }}"

      - name: 失敗時のロールバック手順の明示
        if: failure()
        run: |
          echo "::error::マイグレーションの適用に失敗しました。**アプリのリリースは実行されません**"
          echo "  まず ③ で取得した CloudWatch Logs を読み、途中まで適用されたかを確認する"
          echo "  非破壊変更: 逆方向のマイグレーションを適用するか、旧イメージのまま運用を継続する"
          echo "  破壊的変更: 承認時に取得した RDS スナップショットから復元する (承認コメントの ID を参照)"

  # === 3. Managed Agent の発行・更新 (H-3 / D-6) =============================
  # **アプリのリリースより前**に実行する。schema を増やしたのに Agent が古いままだと、
  # 新しい引数が黙って捨てられる (BE-8) / 台帳の前提チェックが常に失敗する (BE-10)。
  plan_agent:
    name: Agent 差分の検査
    needs: [build, plan_migration, apply_migration]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan_migration.result == 'success' && needs.apply_migration.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      has_diff: ${{ steps.plan.outputs.has_diff }}
      approval_env: ${{ steps.route.outputs.approval_env }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS 認証 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 差分比較のために SSM の発行元ハッシュ記録を読む (書き込みは apply_agent 側)
          role-to-assume: <デプロイ用 IAM ロールの ARN>
          aws-region: ap-northeast-1

      - name: prompts / tool schema の差分検出
        id: plan
        # 出力契約: has_diff=true|false / agent-diff.txt (承認前に人間が読む差分)
        #   1. **`prompts/agents.yaml` が列挙したファイル**と tool schema のハッシュを、
        #      前回発行時の記録 (SSM: /hassan-v3/<env>/agent/<name>/source-hash) と比較する
        #      → **`prompts/` 全体をハッシュ対象にしない**。直接 LLM API 用のプロンプトも
        #        prompts/<domain>/ に置かれるため (architecture.md D-E / D-B')、全体にすると
        #        誤字修正で Agent ID が更新され、**進行中セッションが切れる**
        #        (hassan_v3 docs/design/operations.md §5.2 / docs/analysis/poc-prompt-inventory.md §2)
        #   2. 差分が無ければ has_diff=false → 発行をスキップ
        run: |
          : > agent-diff.txt
          echo "(Agent 発行コマンドを実装リポで用意し、agents.yaml を基準にした差分検出をここに実装する)" >> agent-diff.txt
          echo "has_diff=false" >> "$GITHUB_OUTPUT"

      - name: tool schema 3 者一致検査 + agents.yaml の列挙一致検査
        # CI (ci.yml) と同じ検査をここでも実行する。**古い Agent を発行しないための前提条件**。
        # 検査項目 (operations.md §5.2):
        #   ①schema ↔ handler ↔ prompt の 3 者一致 (BE-8)
        #   ②**Agent 発行コマンドが実際に送る prompt / tool の集合と `prompts/agents.yaml` の列挙が一致**
        #     (列挙漏れが「再発行されない」に倒れるのを防ぐ)
        # 未実装なら落とす (無言のスキップにしない — ci.yml と同じ扱い)
        run: |
          if [ -x scripts/check-tool-contract.sh ]; then
            bash scripts/check-tool-contract.sh
          else
            echo "::error::scripts/check-tool-contract.sh が未実装です (設計: D-6 / BE-8)"
            exit 1
          fi

      - name: 承認ルーティングの決定
        id: route
        # dev は自動 (dev の Agent ID は dev 専用。切断の影響は開発者のみ) / prod は承認必須
        run: |
          if [ '${{ needs.build.outputs.env_name }}' = "prod" ]; then
            echo "approval_env=prod-agent" >> "$GITHUB_OUTPUT"
          else
            echo "approval_env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: 承認材料をジョブサマリへ出す
        run: |
          {
            echo "## Managed Agent 再発行 (H-3) の承認材料"
            echo "- 適用先: \`${{ needs.build.outputs.env_name }}\` / 差分あり: \`${{ steps.plan.outputs.has_diff }}\`"
            echo "- 3 者一致検査: 上のステップが成功していること"
            echo "- **Tools は更新時に全置換される (BE-9)** — 下の差分で既存ツール (web_search 等) の欠落を確認する"
            echo ""
            echo '```diff'
            cat agent-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply_agent:
    name: Managed Agent の再発行 (H-3)
    needs: [build, plan_agent]
    if: ${{ needs.plan_agent.outputs.has_diff == 'true' }}
    runs-on: ubuntu-latest
    # ここが H-3 の承認位置 (prod-agent に required reviewers を設定)
    environment: ${{ needs.plan_agent.outputs.approval_env }}
    env:
      ENV_NAME: ${{ needs.build.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS 認証 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 要求権限: secretsmanager:GetSecretValue (/hassan-v3/<env>/anthropic/api-key のみ) /
          #           ssm:PutParameter (/hassan-v3/<env>/agent/* と .../anthropic/environment-id のみ)
          role-to-assume: <デプロイ用 IAM ロールの ARN>
          aws-region: ap-northeast-1

      - name: 再発行と Agent ID / Environment ID の保存
        # **API キーを GitHub environment secret に置かない** — OIDC ロールで Secrets Manager から取る
        # (hassan_v3 docs/design/operations.md §4.1 の限定列挙)。
        # 取得した値はログに出さない (echo / set -x を使わない)
        run: |
          set -euo pipefail
          ANTHROPIC_API_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "/hassan-v3/${ENV_NAME}/anthropic/api-key" \
            --query SecretString --output text)
          export ANTHROPIC_API_KEY
          echo "(Agent 発行コマンドを実装リポで用意して呼び出す)"
          echo "  1. 当該環境の Agent を再発行する (Tools は全置換 — 既存ツールを落とさない。BE-9)"
          echo "  2. 新しい Agent ID を SSM の /hassan-v3/${ENV_NAME}/agent/<name>/id へ書く"
          echo "  3. **発行元のハッシュ**を /hassan-v3/${ENV_NAME}/agent/<name>/source-hash へ書く"
          echo "     (次回の plan_agent がこれと比較する。agents.yaml の列挙が基準)"
          echo "  4. **Environment を新規作成した場合は /hassan-v3/${ENV_NAME}/anthropic/environment-id も更新する**"
          echo "     (Environment ID は Agent ID と対で必須の設定値 — operations.md OP-E)"
          echo "  5. **旧 ID は SSM の前バージョンとして残る** (切り戻しに使う。operations.md §5.3)"
          echo "  ※ アプリは Agent ID / Environment ID を**起動時に 1 回だけ解決する** (同 §3.3 の⑤) ため、"
          echo "     この書き込みだけでは稼働中タスクに反映されない。反映は release (タスク置換) で起きる"

      - name: 失敗時のロールバック手順の明示
        if: failure()
        run: |
          echo "::error::Agent の再発行に失敗しました。**アプリのリリースは実行されません**"
          echo "  SSM の Agent ID / Environment ID を前バージョンへ戻し、コードも旧イメージのまま維持する"
          echo "  稼働中タスクは古い ID を保持し続けているため、戻した後にタスクを置換する (rollback.yml)"

  # === 4. サービスのリリース (H-4) ==========================================
  release:
    name: ecspresso でリリース (H-4)
    needs: [build, plan_migration, apply_migration, plan_agent, apply_agent]
    # スキップされた承認ジョブ (差分なし) は許容し、失敗は許容しない
    if: >-
      ${{ !cancelled()
        && needs.build.result == 'success'
        && needs.plan_migration.result == 'success'
        && needs.apply_migration.result != 'failure'
        && needs.plan_agent.result == 'success'
        && needs.apply_agent.result != 'failure' }}
    runs-on: ubuntu-latest
    # ここが H-4 の承認位置。dev は承認者を設定しない (継続デプロイ) / prod は required reviewers 必須
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'prod' || 'dev' }}
    env:
      ENV_NAME: ${{ needs.build.outputs.env_name }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS 認証 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: <デプロイ用 IAM ロールの ARN>
          aws-region: ap-northeast-1

      - name: ecspresso のセットアップ
        uses: kayac/ecspresso@v2
        with:
          version: v2

      - name: デプロイ
        run: |
          ecspresso deploy \
            --config=<stacks/${ENV_NAME}/ecspresso.yml> \
            --tasks-config-env IMAGE="${IMAGE}" \
            --wait-until=service-stable
          # タスク定義は ecspresso のテンプレート機能で IMAGE を差し込む
          # (JSON をリポジトリへ書き戻さない)

      - name: ロールバック手段の明示 (失敗時)
        if: failure()
        # **自動で戻さない** — 原因が DB 側にある場合にアプリだけが戻り、状態の組み合わせが増える
        # (hassan_v3 docs/design/operations.md §5.3)。起動先を出力するだけにする
        run: |
          echo "::error::デプロイに失敗しました。ロールバックは rollback.yml (workflow_dispatch) から起動する:"
          echo "  gh workflow run rollback.yml -f environment=${ENV_NAME} -f target=service -f reason=\"<障害の症状を 1 行で>\""
          echo "  (実行できるのは prod* environment の承認者。個人の AWS 認証情報では実行しない)"
          echo "  中身: ecspresso rollback --config=<stacks/${ENV_NAME}/ecspresso.yml> --wait-until=service-stable"
          echo "  Agent を再発行済みの場合は target=service+agent を選ぶ — SSM の Agent ID / Environment ID を"
          echo "  前バージョンへ戻したうえでタスクを置換する (04-human-checkpoints.md §2.3 / operations.md §5.3)"
          echo "  マイグレーションを適用済みの場合、非破壊なら戻さない / 破壊的ならスナップショットから復元する"

      # === dev デプロイ完了を frontend リポへ通知する (E2E のトリガー) ==================
      # hassan_v3 docs/design/testing.md §7.4: E2E は「main マージ後の dev デプロイ完了」に回す。
      # **FE の e2e.yml は repository_dispatch (types: dev-deployed) を待っている** —
      # 送信側がここに無いと、そのトリガーは永久に発火しない (機構の無い設計になる)。
      #
      # 前提: **クロスリポジトリの dispatch には frontend リポへの権限を持つトークンが必要**
      # (`GITHUB_TOKEN` は自リポジトリにしか効かない)。GitHub App のインストールトークンか
      # fine-grained PAT を `E2E_DISPATCH_TOKEN` として dev environment に登録する
      # (operations.md §4.1 の「置いてよい値」の例外として扱う判断が要る = 要確認)。
      #
      # トークン未設定でもデプロイは失敗させない (E2E はブロックしない設計 — testing.md §7.4)。
      # ただし**無言のスキップにはせず警告を出す** (トリガーが死んでいることに気付けるように)。
      - name: E2E の起動通知 (dev のみ)
        if: needs.build.outputs.env_name == 'dev'
        env:
          DISPATCH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          FRONTEND_REPO: <owner/frontend-repo>
        run: |
          set -uo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::warning::E2E_DISPATCH_TOKEN が未設定のため E2E を起動できません" \
                 "(frontend の e2e.yml は repository_dispatch を待っています)。" \
                 "nightly では回りますが、このデプロイに対する E2E は実行されません"
            exit 0
          fi
          # **HTTP ステータスを明示的に見る** — `curl -sS` は 4xx / 5xx でも終了コード 0 を返すため、
          # `|| echo` だけでは「トークンが無効で通知できていない」ことに永久に気付けない
          # (dispatch の成功は 204 No Content)。
          HTTP_CODE=$(curl -sS -o /tmp/dispatch-res.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            "https://api.github.com/repos/${FRONTEND_REPO}/dispatches" \
            -d "{\"event_type\":\"dev-deployed\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}" || echo "000")
          if [ "$HTTP_CODE" = "204" ]; then
            echo "E2E の起動通知に成功しました (204)"
          else
            # **デプロイは失敗させない** (E2E はブロックしない設計) が、**警告は必ず出す**
            echo "::warning::E2E の起動通知に失敗しました (HTTP ${HTTP_CODE})。" \
                 "トークンの権限 (frontend リポの dispatch) と FRONTEND_REPO の値を確認してください。" \
                 "E2E は nightly では回りますが、このデプロイに対する E2E は実行されません"
            head -c 500 /tmp/dispatch-res.txt || true
          fi
