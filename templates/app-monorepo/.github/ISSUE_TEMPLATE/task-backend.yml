name: 実装タスク (backend)
# app モノレポの backend/ サブツリー用。frontend は task-frontend.yml を使う。
description: 1 issue = 1 PR = 同じ層の縦串・同じ検証手段で閉じる AC 群 (.claude/rules/02-issue-granularity.md §1)
title: "<feat|fix|refactor|chore|docs>: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **必須 5 欄** (対象 AC-ID / 影響する層 / 検証コマンド / 人間チェックポイント / 依存 issue) を埋めてください。
        欄が欠けている issue は S-1 (issue 受領) で差し戻されます。
        粒度の判断は `.claude/rules/02-issue-granularity.md` §1.2、リポ跨ぎ / サブツリー跨ぎの順序は同 §2 が正です。

  # --- 必須 1: 対象 AC-ID -------------------------------------------------
  - type: input
    id: ac-ids
    attributes:
      label: 対象 AC-ID (必須)
      description: >-
        設計リポ hassan_v3 の requirements.md に書かれた AC-ID を feature 名付きで列挙する。
        ここに書いた AC-ID はテスト名に埋め込まれ (例: TestThemeList_AC4_2_OwnerScope)、
        S-6 で機械照合される (rule 02 §3.1 の V-2 / V-3)。
      placeholder: "productionization / AC-4.2, AC-4.3"
    validations:
      required: true

  # --- 必須 2: 影響する層 -------------------------------------------------
  - type: dropdown
    id: layers
    attributes:
      label: 影響する層 (必須・複数選択可)
      description: 4 層 + entity / gateway の計 6 パッケージ層 + 生成物・Agent。依存規則 L-1〜L-6 は CLAUDE.md が正 (.golangci.yml が機械強制)。
      multiple: true
      options:
        - Controller (HTTP / SSE / 認証認可)
        - UseCase (手続き・複数ドメインの協調・トランザクション境界)
        - Service (1 ドメインに閉じた業務ロジック・ツールループ・安全弁)
        - entity (副作用のない計算・変換・ドメイン型)
        - Repository (データアクセス)
        - gateway (外部 SDK / HTTP 呼び出し・LLM 計測値の生成)
        - DB スキーマ / マイグレーション
        - Managed Agent (system prompt / custom tool schema)
        - 生成物 (sqlc / wire / OpenAPI)
        - 横断 (ログ・エラー・設定)
    validations:
      required: true

  # --- 必須 3: 実行すべき検証コマンド -------------------------------------
  - type: textarea
    id: verification
    attributes:
      label: 実行すべき検証コマンド (必須)
      description: >-
        S-6 でオーケストレーターが自分の手で実行するコマンド。既定値はリポの検証ゲート
        (rule 01 §1.3 の backend 行)。この issue 固有の追加コマンドがあれば書き足す。
      value: |
        go build ./...
        go vet ./...
        go test ./...
        golangci-lint run
        make -C backend sqlc wire && scripts/check-regen.sh backend
        make -C backend docs && scripts/check-regen.sh api/openapi.yaml
        npm --prefix frontend run generate && scripts/check-regen.sh frontend/src/generated
        # 対象 AC のテストだけを名指しで実行 (AC-ID は上の欄に合わせて置換)
        go test ./... -run 'AC4_2' -v
    validations:
      required: true

  # --- 必須 4: 人間チェックポイントの該当有無 -----------------------------
  - type: dropdown
    id: human-checkpoints
    attributes:
      label: 人間チェックポイントの該当有無 (必須・複数選択可)
      description: >-
        該当が無い場合も「該当なし」を選ぶ (空欄にしない)。承認機構は rule 04-human-checkpoints.md が正。
        「着手前の計画承認」は 新規ドメインの追加 / 設計書に無いパターンの実装 / infra 跨ぎ の
        いずれかに該当する場合に選ぶ (該当条件は rule 04 §1.2 の H-5)。
        **FE/BE 跨ぎは 1 PR に収まるため H-5 の条件ではない** (2 リポ構成。MR-6 の宣言は PR テンプレート §5)。
      multiple: true
      options:
        - 該当なし
        - 着手前の計画承認 (新規ドメイン / 設計書に無いパターン / infra 跨ぎ)
        - DB マイグレーションの適用 (rule 04 の H-2)
        - Managed Agent の再発行 (rule 04 の H-3) — system prompt / tool schema を変える場合は必須
        - 本番デプロイ (rule 04 の H-4)
    validations:
      required: true

  # --- 必須 5: 依存 issue ------------------------------------------------
  - type: textarea
    id: dependencies
    attributes:
      label: 依存 issue (必須)
      description: >-
        依存方向は infra → app。**infra への依存はマージでは足りず `apply` 済みが着手条件**。
        API 破壊的変更は ①backend 新旧併存 → ②frontend 切替 → ③backend 旧削除 の順で、
        **①②③ は別 PR に分ける** (rule 02 §2.2.1 / MR-6)。この issue が ① なら ② の issue 番号を書く。
        **frontend への依存は同一リポジトリ内の issue 番号 (`#N`) で書く** — 他リポではない。
        依存が無い場合は「なし」と書く。S-2 で依存先のマージ済みと (infra なら) apply 済みを確認する。
      value: |
        なし
      placeholder: |
        <owner>/<infra-repo>#12 (Secrets の追加。apply 済みであることを S-2 で確認)
        #45 (② frontend 切替。この issue の新 IF 追加がマージされた後に着手)
    validations:
      required: true

  # --- 任意欄 -------------------------------------------------------------
  - type: textarea
    id: context
    attributes:
      label: 背景 / 目的 (任意)
      description: この issue で何が達成されるか。1〜3 行。
    validations:
      required: false

  - type: input
    id: design-ref
    attributes:
      label: 設計書の該当箇所 (任意)
      description: hassan_v3 の設計書のファイルと節。該当が無い場合は空欄でよい (S-3 で設計差し戻しの判定対象になる)。
      placeholder: "docs/design/API/themes.md §3.2 / docs/design/auth.md §2.2"
    validations:
      required: false

  - type: textarea
    id: out-of-scope
    attributes:
      label: 非スコープ / 備考 (任意)
      description: >-
        この issue で扱わないこと。rule 02 §1.2 手順 3 の上限
        (生成物を除く変更ファイル数 15 / 差分行数 800) を超える見込みの場合は、
        割れない理由をここに書く (理由の記載がない超過は S-2 で差し戻す)。
    validations:
      required: false

  - type: dropdown
    id: model
    attributes:
      label: 想定モデル (任意)
      description: rule 03-model-escalation.md の基準による着手前判定の結果。実行中の昇格があれば issue コメントで上書きする。
      options:
        - 未判定
        - sonnet (定型・前例あり)
        - opus (新規ドメイン / 並行処理・状態機械 / 設計に前例なし)
    validations:
      required: false
